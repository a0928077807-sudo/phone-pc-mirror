<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<title>直播</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: #111214; color: #ecebe6;
    font: 16px/1.5 system-ui, -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  }
  form { width: 100%; max-width: 340px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { color: #9a9993; font-size: 14px; margin: 0 0 22px; }
  input {
    width: 100%; font: inherit; font-size: 18px; letter-spacing: .08em; padding: 14px 16px;
    border-radius: 12px; border: 1px solid #2d2e33; background: #1c1d21; color: inherit; outline: none;
  }
  input:focus { border-color: #6b6a65; }
  button {
    width: 100%; margin-top: 12px; font: inherit; font-weight: 600; padding: 14px; border: 0;
    border-radius: 12px; background: #ecebe6; color: #111214; cursor: pointer;
  }
  button:disabled { opacity: .5; }
  .err { color: #e48a62; font-size: 14px; min-height: 21px; margin-top: 10px; }
</style>
</head>
<body>
<form id="f">
  <h1>电脑直播</h1>
  <p>输入对方给你的密码就能看。</p>
  <input id="pw" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="密码" required>
  <button id="go">进入</button>
  <div class="err" id="err"></div>
</form>
<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; err.textContent = '';
  try {
    const r = await fetch('/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('pw').value })
    });
    if (r.ok) { location.reload(); return; }
    err.textContent = r.status === 403 ? '密码不对' : ((await r.json()).error || '出错了，再试一次');
  } catch (_) {
    err.textContent = '连不上，检查一下网络';
  }
  btn.disabled = false;
});
</script>
</body>
</html>
